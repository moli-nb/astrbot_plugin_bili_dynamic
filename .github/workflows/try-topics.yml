name: Try Topics

on:
  push:
    paths:
      - '.github/workflows/try-topics.yml'

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository topics
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/topics" \
            -d '{"names":["astrbot","bilibili","qqbot","plugin"]}')
          echo "HTTP $code"
          cat /tmp/resp.json || true
