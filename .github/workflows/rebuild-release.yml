name: Rebuild Release

on:
  push:
    paths:
      - '.github/workflows/rebuild-release.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild release v1.0.0 on clean commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --target c2505e937eaefe469a5e1b73c250a06316823f8a --title "v1.0.0" --notes "首个版本：B 站 UP 主动态订阅推送插件（AstrBot + QQ 官方机器人 Markdown 排版）"
