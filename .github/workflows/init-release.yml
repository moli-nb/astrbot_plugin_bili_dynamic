name: Init Release

on:
  push:
    paths:
      - '.github/workflows/init-release.yml'

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Create release v1.0.0 if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v1.0.0 already exists"
          else
            gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" \
              --title "v1.0.0" \
              --notes "首个版本：B 站 UP 主动态订阅推送插件（AstrBot + QQ 官方机器人 Markdown 排版）

- 全局监控 + 按会话订阅推送（id 水位线、置顶动态特殊处理）
- 图文 / 视频 / 转发 / 专栏 / 文字动态模板，投票 / 附视频附加卡片
- 订阅列表可点击按钮、帮助消息可点击标签
- 完整动态接口被风控时自动降级图文 opus 接口
- 适配平台：qq_official、qq_official_webhook"
          fi
