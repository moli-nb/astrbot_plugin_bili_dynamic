name: Init Release

on:
  push:
    paths:
      - '.github/workflows/init-release.yml'

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Create release v1.0.0 if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v1.0.0 already exists"
          else
            gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --title "v1.0.0" --notes "首个版本：B 站 UP 主动态订阅推送插件（AstrBot + QQ 官方机器人 Markdown 排版）"
          fi
